{% extends "base.html" %}
{% block content %}

<h3 class="mb-4">📊 Dashboard</h3>

<div class="row g-4">

    <div class="col-md-3">
        <div class="card shadow-lg border-0" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
            <div class="card-body text-center">
                <div style="font-size: 3rem; opacity: 0.9;">
                    <i class="fa-solid fa-calendar"></i>
                </div>
                <h6 class="mt-3 mb-1" style="font-weight: 600; opacity: 0.9;">Total Events</h6>
                <h2 class="mb-0" style="font-weight: 700; font-size: 2.5rem;">{{ stats.events }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow-lg border-0" style="background: linear-gradient(135deg, #48bb78 0%, #38a169 100%); color: white;">
            <div class="card-body text-center">
                <div style="font-size: 3rem; opacity: 0.9;">
                    <i class="fa-solid fa-box"></i>
                </div>
                <h6 class="mt-3 mb-1" style="font-weight: 600; opacity: 0.9;">Total Resources</h6>
                <h2 class="mb-0" style="font-weight: 700; font-size: 2.5rem;">{{ stats.resources }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow-lg border-0" style="background: linear-gradient(135deg, #ed8936 0%, #dd6b20 100%); color: white;">
            <div class="card-body text-center">
                <div style="font-size: 3rem; opacity: 0.9;">
                    <i class="fa-solid fa-link"></i>
                </div>
                <h6 class="mt-3 mb-1" style="font-weight: 600; opacity: 0.9;">Total Allocations</h6>
                <h2 class="mb-0" style="font-weight: 700; font-size: 2.5rem;">{{ stats.allocations }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow-lg border-0" style="background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%); color: white;">
            <div class="card-body text-center">
                <div style="font-size: 3rem; opacity: 0.9;">
                    <i class="fa-solid fa-clock"></i>
                </div>
                <h6 class="mt-3 mb-1" style="font-weight: 600; opacity: 0.9;">Upcoming Events</h6>
                <h2 class="mb-0" style="font-weight: 700; font-size: 2.5rem;">{{ stats.upcoming }}</h2>
            </div>
        </div>
    </div>

</div>

<style>
    .card {
        transition: all 0.3s ease;
    }
    
    .card:hover {
        transform: translateY(-10px) scale(1.02);
    }
</style>

{% endblock %}
