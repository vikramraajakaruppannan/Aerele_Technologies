{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <h3 class="mb-4">✏️ Edit Event</h3>

        <div class="card shadow-lg p-4">
            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input class="form-control"
                           name="title"
                           value="{{ event.title }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Start Time</label>
                    <input type="datetime-local"
                           class="form-control"
                           name="start_time"
                           value="{{ event.start_time|replace(' ', 'T') }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">End Time</label>
                    <input type="datetime-local"
                           class="form-control"
                           name="end_time"
                           value="{{ event.end_time|replace(' ', 'T') }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control"
                              name="description"
                              rows="3">{{ event.description }}</textarea>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/events" class="btn btn-outline-secondary">
                        ← Cancel
                    </a>
                    <button class="btn btn-success">
                        <i class="fa-solid fa-check me-1"></i> Update
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

{% endblock %}
